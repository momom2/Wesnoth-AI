[package]
name = "wesnoth_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "wesnoth_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311", "multiple-pymethods"] }
numpy = "0.23"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
