# Per-test time and coverage for the suite trim (docs/test_trim_20261006.md).
# Temporary: runs on the trim branch when the measurement itself changes.
name: trim-measure

on:
  push:
    branches: ["test/trim-suite"]
    paths:
      - ".github/trim/**"
      - ".github/workflows/trim_measure.yml"

concurrency:
  group: trim-measure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  timing:
    # The suite as CI runs it, with the plugin recording each test's
    # durations. Two runners, so the table can average two samples.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/trim_measure.yml
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy psutil pyyaml huggingface_hub requests pytest ruff==0.15.17
      - name: Build the Rust wheel from this commit
        run: python -m pip install ./rust/wesnoth_core
      - name: Full suite with per-test durations
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/trim
          TRIM_OUT: ${{ github.workspace }}/trim_out/timing_${{ matrix.sample }}.json
        run: python -m pytest -m "" -q -p trim_plugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-${{ matrix.sample }}
          path: trim_out/timing_${{ matrix.sample }}.json

  coverage:
    # The suite under coverage.py, one context per test, child processes
    # included. Slower than the plain run; its durations are not used.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/trim_measure.yml
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy psutil pyyaml huggingface_hub requests pytest ruff==0.15.17 coverage==7.16.2
      - name: Build the Rust wheel from this commit
        run: python -m pip install ./rust/wesnoth_core
      - name: Start coverage in every Python process that asks for it
        run: |
          purelib=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import coverage; coverage.process_startup()" > "$purelib/zz_trim_coverage.pth"
          mkdir -p trim_out/coverage
      - name: Full suite under coverage
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.github/trim/coveragerc
          PYTHONPATH: ${{ github.workspace }}/.github/trim
          TRIM_OUT: ${{ github.workspace }}/trim_out/timing_coverage.json
        run: python -m pytest -m "" -q -p trim_plugin || echo "suite exit $?"
      - name: Combine the data files
        if: always()
        run: |
          ls trim_out/coverage | wc -l
          python -m coverage combine --rcfile=.github/trim/coveragerc --keep
          ls -la trim_out/coverage | tail -3
          gzip -c trim_out/coverage/data > trim_out/coverage_data.sqlite.gz
          ls -la trim_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            trim_out/coverage_data.sqlite.gz
            trim_out/timing_coverage.json
