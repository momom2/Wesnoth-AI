# Temporary: runs the serve-process pool test 40 times to catch its flake.
name: flake-loop

on:
  push:
    branches: ["fix/serve-process-flake"]

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy psutil pyyaml huggingface_hub requests pytest
      - name: Build the Rust wheel
        run: python -m pip install ./rust/wesnoth_core
      - name: Loop the test
        run: |
          fails=0
          for i in $(seq 1 40); do
            if python -m pytest -m "" -q -s -p no:cacheprovider \
                "tests/test_serve_process.py::test_pool_with_a_serve_process_serves_syncs_and_refuses_stale_weights" \
                --log-level=INFO --log-format="%(asctime)s.%(msecs)03d %(name)s %(levelname)s %(message)s" \
                > "run_$i.txt" 2>&1; then
              echo "pass $i: $(grep -m1 '^WINDOW' run_$i.txt)"
            else
              fails=$((fails+1))
              echo "=== FAIL $i"
              grep -E "^WINDOW|AssertionError|actor_stream|actor_pool|selfplay_game ERROR|serving stopped|unanswered" "run_$i.txt" | grep -v "encoder WARNING" | tail -40
            fi
          done
          echo "failures: $fails of 40"
