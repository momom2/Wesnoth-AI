# THROWAWAY (exp/serve-queue-closed-repro, never merged): runs the serve
# process test in a loop to reproduce the 2026-09-24 flake and print the
# first stream window's games.
name: tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy psutil pyyaml huggingface_hub pytest ruff==0.15.17

      - name: Build the Rust wheel from this commit
        run: python -m pip install ./rust/wesnoth_core

      - name: Repro loop
        run: |
          set +e
          fails=0
          for i in $(seq 1 25); do
            t0=$(date +%s)
            python -m pytest -m "" -q -s -p no:cacheprovider \
              "tests/test_serve_process.py::test_pool_with_a_serve_process_serves_syncs_and_refuses_stale_weights" \
              > run.log 2>&1
            rc=$?
            echo "run $i rc $rc $(( $(date +%s) - t0 ))s: $(grep REPRO run.log)"
            if [ $rc -ne 0 ]; then
              fails=$((fails+1))
              grep -E "^E |Error:|FAILED" run.log | head -8
            fi
          done
          echo "shard ${{ matrix.shard }}: failures $fails of 25"
