# live_ai.cfg
# Our side's AI in a live game against the default AI
# (tools/live_vs_rca.py), given with `--ai-config N:`. Its one stage
# (lua/live_stage.lua) reports the board at each decision and runs the
# engine commands the Python driver sends.

[ai]
    id=live_python_ai
    description="Live Python AI"

    [engine]
        name="lua"
        code=<<
            return wesnoth.require("~add-ons/wesnoth_ai/lua/live_stage.lua")
        >>
    [/engine]

    [stage]
        id=live_python_turn
        engine="lua"
        code="(...):run_turn()"
    [/stage]
[/ai]
