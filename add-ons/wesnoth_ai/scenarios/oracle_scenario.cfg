# oracle_scenario.cfg
# The hidden-units oracle (tools/hidden_units_oracle.py): a 14x14 grass
# board whose terrain, units, fog and time of day are set at prestart
# from ~add-ons/wesnoth_ai/games/oracle/setup.lua (lua/oracle_setup.lua),
# so a Python driver can ask the engine itself where a move stops and
# which units a side can see. Side 1 runs the Python-driven AI stage;
# side 2 has no controller and only fields the hiders.

[test]
    id=ai_oracle
    name="AI Oracle - hidden units"

    map_data="border_size=1
usage=map

_off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, _off^_usr
_off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr, _off^_usr
"

    {DEFAULT_SCHEDULE}
    turns=-1
    victory_when_enemies_defeated=no

    [side]
        side=1
        controller=ai
        no_leader=yes
        save_id=oracle_side_1
        team_name=one
        user_team_name="Probe"
        fog=yes
        shroud=no
        gold=0
        income=0
        {~add-ons/wesnoth_ai/ai_config.cfg}
    [/side]

    [side]
        side=2
        controller=null
        no_leader=yes
        save_id=oracle_side_2
        team_name=two
        user_team_name="Hiders"
        fog=yes
        shroud=no
        gold=0
        income=0
    [/side]

    [event]
        name=preload
        first_time_only=yes
        [lua]
            code=<<
                math.randomseed(os.time() + math.floor(os.clock() * 1000000))
                local game_id = string.format("g%09d", math.random(1, 999999999))
                wml.variables.game_id = game_id
                wml.variables.oracle_mode = true
                std_print("=== AI Oracle Scenario Starting ===")
                std_print("Game ID: " .. game_id)
            >>
        [/lua]
    [/event]

    [event]
        name=prestart
        first_time_only=yes
        [lua]
            code=<<
                local setup = wesnoth.require("~add-ons/wesnoth_ai/lua/oracle_setup.lua")
                setup.apply()
            >>
        [/lua]
    [/event]
[/test]
