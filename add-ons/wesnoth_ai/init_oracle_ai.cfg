# init_oracle_ai.cfg
# The scenario-init oracle's AI (tools/scenario_init_oracle.py), given to
# side 1 with `--ai-config1=`. On that side's first turn it reports the
# whole board as one frame (lua/init_oracle.lua) and ends the turn; the
# Python side reads the frame and terminates Wesnoth.

[ai]
    id=scenario_init_oracle
    description="Scenario-init oracle"

    [engine]
        name="lua"
        code=<<
            return wesnoth.require("~add-ons/wesnoth_ai/lua/init_oracle.lua")
        >>
    [/engine]

    [stage]
        id=scenario_init_oracle_report
        engine="lua"
        code="(...):report()"
    [/stage]
[/ai]
