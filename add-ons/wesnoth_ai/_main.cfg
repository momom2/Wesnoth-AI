# _main.cfg
# Main entry point for the wesnoth_ai add-on

#textdomain wesnoth-wesnoth_ai

[binary_path]
    path=data/add-ons/wesnoth_ai
[/binary_path]

# The hidden-units oracle board (tools/hidden_units_oracle.py). The live
# games (tools/live_vs_rca.py) and the scenario-init oracle
# (tools/scenario_init_oracle.py) start multiplayer scenarios from the
# command line and load their AI configs (live_ai.cfg, init_oracle_ai.cfg)
# by path.
{~add-ons/wesnoth_ai/scenarios/oracle_scenario.cfg}

# The era the live games are played in: the default era with a hosted
# game's experience (tools/lobby_era.py, which writes it).
{~add-ons/wesnoth_ai/eras/lobby_era.cfg}
