# ai_config.cfg
# AI wiring for the hidden-units oracle's scripted side
# (tools/hidden_units_oracle.py). A CUSTOM Lua stage (not a candidate
# action) avoids Wesnoth's RCA blacklist-on-failure rule, under which a
# rejected action would end the turn after one attempt.
#
# The [engine] block loads turn_stage.lua as the side's Lua engine.
# The [stage] block calls `(...):run_turn()` where `(...)` is the
# module returned by the engine code. See turn_stage.lua for the loop.

[ai]
    id=external_python_ai
    description="External Python AI"

    [engine]
        name="lua"
        code=<<
            return wesnoth.require("~add-ons/wesnoth_ai/lua/turn_stage.lua")
        >>
    [/engine]

    [stage]
        id=external_python_turn
        engine="lua"
        code="(...):run_turn()"
    [/stage]
[/ai]
