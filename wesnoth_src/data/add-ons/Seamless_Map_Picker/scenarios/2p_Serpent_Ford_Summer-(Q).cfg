[multiplayer]
    id=PYRA_Serpent_Ford_Summer
    name= _ "2p - Serpent Ford Summer"
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Serpent_Ford_Summer.map}"
    description= _ "A sea serpent chose this ford as its hunting grounds a long time ago. Its reign of terror was ended by archmage Estenth The Mad, famous for groundbreaking improvements in polymorphic spellcasting (Created by Quetzalcoatl, currently unmaintained)."
    random_start_time="yes"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=north
        user_team_name= _ "teamname^North"
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=south
        user_team_name= _ "teamname^South"
        fog=yes
    [/side]
[/multiplayer]
