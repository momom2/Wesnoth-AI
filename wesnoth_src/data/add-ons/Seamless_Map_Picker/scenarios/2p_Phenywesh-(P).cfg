#textdomain wesnoth-multiplayer

[multiplayer]
    id=multiplayer_Phenywesh_Sandbox
    name= _ "2p — Phenywesh"
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Phenywesh.map}"
    description= _ "Created by: potyi."
    random_start_time="no"

    {DEFAULT_SCHEDULE_DAWN}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=north
        user_team_name= _ "teamname^North"
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=south
        user_team_name= _ "teamname^South"
        fog=yes
        [village]
            x=25
            y=21
        [/village]
    [/side]
[/multiplayer]
