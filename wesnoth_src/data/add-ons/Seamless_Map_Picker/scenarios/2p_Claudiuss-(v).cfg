[multiplayer]
    id=PYRA_Claudiuss
    name= _ "2p - Claudiuss"
    description= _ "Warfare transforms the simple farms and villages of a peaceful region into a subtly parceled battlefield."
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Claudiuss.map}"
    random_start_time="yes"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=north
        user_team_name= _ "teamname^North"
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=south
        user_team_name= _ "teamname^South"
        fog=yes
        [village]
            x=20
            y=22
        [/village]
    [/side]
[/multiplayer]
