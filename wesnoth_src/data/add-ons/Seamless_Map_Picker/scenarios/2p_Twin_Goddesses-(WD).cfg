#textdomain wesnoth-MP_Maps_By_White_Dragon
[multiplayer]
    id=White_Dragon_Twin_Goddesses
    name= _ "2p — Twin Goddesses"
    description= _ "This volcanic cave was once a temple, where in ancient times people had been worshipping their gods, and were throwing their offerings into lava pits."
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Twin_Goddesses.map}"
    random_start_time="no"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
		gold=100
        team_name=north
        user_team_name= _ "teamname^North"
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
		gold=100
        team_name=south
        user_team_name= _ "teamname^South"
        fog=yes
        [village]
            x=14
            y=17
        [/village]
    [/side]
[/multiplayer]
