#textdomain wesnoth-multiplayer

[multiplayer]
    id=multiplayer_Heart_Mountains_Caves_Sandbox
    name= _ "2p — Heart Mountains' Caves"
    description= _ "A map made by Sulik, improved by Rigor, and maintained by Horus."
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Heart_Mountains_Caves.map}"
    random_start_time="no"
    allow_new_game=no

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=south
        user_team_name= _ "teamname^South"
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=north
        user_team_name= _ "teamname^North"
        fog=yes
        [village]
            x=25
            y=7
        [/village]
    [/side]
[/multiplayer]
