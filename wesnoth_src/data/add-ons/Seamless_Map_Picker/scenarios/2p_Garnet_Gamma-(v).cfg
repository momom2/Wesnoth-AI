[multiplayer]
    id=PYRA_Garnet_Gamma
    name= _ "2p - Garnet Gamma"
    description= _ "Two armies collide on this disjointed coastal landscape of hidden caves and jagged rivers."
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Garnet_Gamma.map}"
    random_start_time="yes"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=north
        user_team_name= _ "teamname^North"
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=south
        user_team_name= _ "teamname^South"
        fog=yes
        [village]
            x=2
            y=25
        [/village]
    [/side]
[/multiplayer]