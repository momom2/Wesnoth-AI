#textdomain wesnoth-multiplayer

[multiplayer]
    id=multiplayer_Devious_Dockyard_Sandbox
    name= _ "2p — Devious Dockyard"
    description= _ "Created by Horus2."
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Devious_Dockyard.map}"
    random_start_time="no"

    {DEFAULT_SCHEDULE_DAWN}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=east
        user_team_name= _ "teamname^East"
        fog=yes
        [village]
            x=36
            y=1
        [/village]
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=west
        user_team_name= _ "teamname^West"
        fog=yes
    [/side]
[/multiplayer]
