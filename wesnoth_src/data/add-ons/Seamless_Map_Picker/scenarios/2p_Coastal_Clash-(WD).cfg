        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
		gold=150
        team_name=south
        user_team_name= _ "teamname^South"
        fog=yes
        [village]
            x=24
            y=18
        [/village]
    [/side]
[/multiplayer]
