[multiplayer]
    id=multiplayer_qs_Den_Of_Onis
    name= _ "2p - Den Of Onis"
    description= _ "Den Of Onis edited by Q."
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Den_Of_Onis_Q.map}"
    random_start_time="no"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    {PLACE_IMAGE items/burial.png 15 13}
    {PLACE_IMAGE items/burial.png 26 16}
    {PLACE_IMAGE items/burial.png 4 9}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=south
        user_team_name= _ "teamname^South"
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=north
        user_team_name= _ "teamname^North"
        fog=yes
        [village]
            x=24
            y=6
        [/village]
    [/side]
[/multiplayer]
