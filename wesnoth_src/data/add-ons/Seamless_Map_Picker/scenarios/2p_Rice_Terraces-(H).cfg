#textdomain wesnoth-multiplayer

[multiplayer]
    id=multiplayer_Rice_Terraces_Sandbox
    name= _ "2p — Rice Terraces"
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Rice_Terraces.map}"
    description= _ "Created by Horus2."
    random_start_time="no"

    {DEFAULT_SCHEDULE_DAWN}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=northwest
        user_team_name= _ "teamname^Northwest"
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=southeast
        user_team_name= _ "teamname^Southeast"
        fog=yes
        [village]
            x=29
            y=11
        [/village]
    [/side]
[/multiplayer]
