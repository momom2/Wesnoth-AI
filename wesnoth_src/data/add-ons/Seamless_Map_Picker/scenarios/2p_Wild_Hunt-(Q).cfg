#define PLACE_RIDER UNIT X Y SPEED O1 O2 O3 O4
    [item]
        x={X}
        y={Y}
        halo=units/{UNIT}~O({O1}):{SPEED},units/{UNIT}~O({O2}):{SPEED},units/{UNIT}~O({O3}):{SPEED},units/{UNIT}~O({O4}):{SPEED}
    [/item]
#enddef

[multiplayer]
    id=multiplayer_qs_Wild_Hunt
    name= _ "2p - Wild Hunt"
    description= _ "Blitz edited by Q."
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Wild_Hunt.map}"
    random_start_time="no"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    {PLACE_RIDER "human-loyalists/horseman/horseman-se-attack5.png~RC(magenta>green)" 12 12 444 .4 .5 .4 .3}
    {PLACE_RIDER "elves-wood/outrider/outrider-melee-2.png~RC(magenta>blue)" 14 13 333 .3 .4 .5 .4}
    {PLACE_RIDER "undead/soulless-mounted-attack.png~RC(magenta>red)" 14 15 222 .5 .4 .3 .4}
    {PLACE_RIDER "human-loyalists/horseman/horseman-se-defend1.png~RC(magenta>black)" 15 14 333 .4 .5 .4 .3}
    {PLACE_RIDER "goblins/pillager-moving.png~RC(magenta>teal)" 16 13 444 .3 .4 .5 .4}
    {PLACE_RIDER "elves-wood/rider/rider-melee-2.png~RC(magenta>orange)" 16 14 333 .5 .4 .3 .4}
    {PLACE_RIDER "human-loyalists/horseman/horseman-se-run1.png~RC(magenta>brown)" 17 14 222 .4 .5 .4 .3}
    {PLACE_RIDER "undead/zombie-mounted-attack.png~RC(magenta>purple)" 18 12 333 .3 .4 .5 .4}
    {PLACE_RIDER "goblins/direwolver-attack.png~RC(magenta>black)" 18 14 444 .5 .4 .3 .4}
    {PLACE_RIDER "human-loyalists/horseman/horseman-se-run5.png~RC(magenta>white)" 20 15 333 .4 .5 .4 .3}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        gold=125
        team_name=north
        user_team_name= _ "teamname^North"
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        gold=125
        team_name=south
        user_team_name= _ "teamname^South"
        fog=yes
        [village]
            x=12
            y=24
        [/village]
        [village]
            x=15
            y=25
        [/village]
    [/side]
[/multiplayer]
