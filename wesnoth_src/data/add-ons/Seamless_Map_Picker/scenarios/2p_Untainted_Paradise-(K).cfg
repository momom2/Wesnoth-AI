#textdomain wesnoth-multiplayer

[multiplayer]
    id=multiplayer_Untiainted_Paradise
    name= _ "2p — Untainted Paradise"
    description= _ "An isolated plateau in the far south, at the heart of the tropical rainforest."
    map_data="{~add-ons/Seamless_Map_Picker/maps/2p_Untainted_Paradise.map}"
    random_start_time="no"

    {DEFAULT_SCHEDULE_DAWN}
    {DEFAULT_MUSIC_PLAYLIST}

    {PLACE_IMAGE scenery/nest-full.png 3 3}
    {PLACE_IMAGE scenery/nest-empty.png 43 25}

    [side]
        id=1
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=south
        user_team_name= _ "teamname^South"
        gold=125
        fog=yes
    [/side]
    [side]
        id=2
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=north
        user_team_name= _ "teamname^North"
        gold=125
        fog=yes
        [village]
            x=20
            y=8
        [/village]
    [/side]
[/multiplayer]