#textdomain wl_mappack

[multiplayer]
id=WL_Fire_and_Ice
name= _ "2p - Fire and Ice"
    random_start_time="no"
    map_data="{~add-ons/WL_Mappack/maps/2p_Fire_and_Ice.map}"
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    [side]
    side=1
    canrecruit=yes
    controller=human
    team_name=player1
    user_team_name= _ "teamname^Player 1"
        fog=yes
    [/side]
    [side]
    side=2
    canrecruit=yes
    controller=human
    team_name=player2
    user_team_name= _ "teamname^Player 2"
        fog=yes
	[village]
		x=24
		y=21
	[/village]
    [/side]
[event]
	name=prestart
	[objectives]
		summary="Created by ReNoM
		Russian Wesnoth Community
		www.wesnothlife.ru"
	[objective]
	description= _ "Kill the enemy leader"
	condition=win
	[/objective]
	[/objectives]
[/event]

[/multiplayer]
